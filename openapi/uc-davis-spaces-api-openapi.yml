openapi: 3.2.0
info:
  title: PEAKS API v1 Spaces API
  description: People Equipment Access Keys Space
  contact:
    name: Application Support
    url: https://caeshelp.ucdavis.edu/?appname=Peaks
  license:
    name: MIT
    url: https://github.com/ucdavis/Peaks/blob/master/LICENSE
  version: v1
  ProjectUrl: https://github.com/ucdavis/Peaks/
servers:
- url: https://peaks.ucdavis.edu
  description: PEAKS production API
tags:
- name: Spaces
paths:
  /api/{teamName}/spaces/SearchSpaces:
    get:
      tags:
      - Spaces
      parameters:
      - name: q
        in: query
        schema:
          type: string
      - name: teamName
        in: path
        required: true
        schema:
          type: string
      - name: X-Auth-Token
        in: header
        description: access token
        required: true
        schema:
          type: string
          default: ApiKey
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Space'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - ApiKey:
        - AnyRole
      summary: Get api by team name spaces search spaces
      x-summary-source: derived
      operationId: getApiByTeamNameSpacesSearchSpaces
      x-operation-id-source: derived
  /api/{teamName}/spaces/List:
    get:
      tags:
      - Spaces
      parameters:
      - name: teamName
        in: path
        required: true
        schema:
          type: string
      - name: X-Auth-Token
        in: header
        description: access token
        required: true
        schema:
          type: string
          default: ApiKey
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Space'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - ApiKey:
        - AnyRole
      summary: Get api by team name spaces list
      x-summary-source: derived
      operationId: getApiByTeamNameSpacesList
      x-operation-id-source: derived
  /api/{teamName}/spaces/ShortList:
    get:
      tags:
      - Spaces
      parameters:
      - name: teamName
        in: path
        required: true
        schema:
          type: string
      - name: X-Auth-Token
        in: header
        description: access token
        required: true
        schema:
          type: string
          default: ApiKey
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Space'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - ApiKey:
        - AnyRole
      summary: Get api by team name spaces short list
      x-summary-source: derived
      operationId: getApiByTeamNameSpacesShortList
      x-operation-id-source: derived
  /api/{teamName}/spaces/GetSpacesForKey:
    get:
      tags:
      - Spaces
      parameters:
      - name: keyId
        in: query
        schema:
          type: integer
          format: int32
      - name: teamName
        in: path
        required: true
        schema:
          type: string
      - name: X-Auth-Token
        in: header
        description: access token
        required: true
        schema:
          type: string
          default: ApiKey
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KeyXSpace'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - ApiKey:
        - AnyRole
      summary: Get api by team name spaces get spaces for key
      x-summary-source: derived
      operationId: getApiByTeamNameSpacesGetSpacesForKey
      x-operation-id-source: derived
  /api/{teamName}/spaces/GetTagsInSpace:
    get:
      tags:
      - Spaces
      parameters:
      - name: spaceId
        in: query
        schema:
          type: integer
          format: int32
      - name: teamName
        in: path
        required: true
        schema:
          type: string
      - name: X-Auth-Token
        in: header
        description: access token
        required: true
        schema:
          type: string
          default: ApiKey
