        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Workstation'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - ApiKey:
        - AnyRole
      summary: Get api by team name spaces get tags in space
      x-summary-source: derived
      operationId: getApiByTeamNameSpacesGetTagsInSpace
      x-operation-id-source: derived
  /api/{teamName}/spaces/Details/{id}:
    get:
      tags:
      - Spaces
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: teamName
        in: path
        required: true
        schema:
          type: string
      - name: X-Auth-Token
        in: header
        description: access token
        required: true
        schema:
          type: string
          default: ApiKey
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Space'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
