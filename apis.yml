apis:
- aid: uc-davis:shibboleth-idp
  name: UC Davis Shibboleth Identity Provider (SAML 2.0 / InCommon)
  description: >-
    UC Davis operates its own SAML 2.0 identity provider and publishes signed federation metadata as entityID
    urn:mace:incommon:ucdavis.edu. This is machine-readable, institution-operated by definition, and almost
    never catalogued: no vendor can be running it, because the metadata is served from UC Davis address
    space (shibboleth.gdc.ucdavis.edu, 169.237.248.65) and carries UC Davis's own organization name. Four
    SSO bindings and two SLO bindings are advertised across Shibboleth 1.x, SAML 1.1 and SAML 2.0. Verified
    200 at both the campus endpoint and the InCommon MDQ service on 2026-08-19.
  humanURL: https://shibboleth.ucdavis.edu/idp/shibboleth
  tags:
