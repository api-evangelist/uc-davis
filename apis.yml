- aid: uc-davis:health-fhir-r4
  name: UC Davis Health FHIR R4 endpoint
  description: >-
    UC Davis Health runs a live HL7 FHIR R4 endpoint on its own domain at emrrp.ucdmc.ucdavis.edu, registered
    in Epic's public endpoint directory as 'UC Davis' and 'UC Davis - MMC' (active since 2024-11-09).
    Verified 2026-08-19: /metadata returns a 93KB CapabilityStatement instantiating the US Core server
    profile and the bulk-data profile, and /.well-known/smart-configuration returns a SMART on FHIR discovery
    document with authorization and token endpoints on the same host. IMPORTANT ATTRIBUTION NOTE: the
    host and the operation are UC Davis Health's, but the CapabilityStatement is Epic's — its own copyright
    line reads 'Copyright Epic 1979-2026'. Epic's contract is therefore NOT saved into this repo; only
    the relationship and the live discovery documents are recorded, so UC Davis is credited for operating
    a FHIR endpoint and not for Epic's engineering.
  humanURL: https://health.ucdavis.edu/systems-integration/developers
