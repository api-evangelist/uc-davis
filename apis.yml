- aid: uc-davis:escholarship-tenant
  name: eScholarship — UC Davis unit (tenant)
  description: >-
    UC Davis's open-access scholarly output is deposited into eScholarship, the University of California's
    shared repository, under the campus unit path /uc/ucd. The content, the deposits and the DOIs are
    UC Davis's; the platform and the contract are the California Digital Library's, and the OAI-PMH endpoint
    at escholarship.org/oai serves all ten UC campuses from a single set ('everything') with no UC Davis
    setSpec. Recorded as a TENANT relationship: this is a real institutional fact and one of the few programmable
    research surfaces UC Davis has, but no eScholarship or CDL contract is saved under this slug. Note
    escholarship.org answers automated clients with an AWS WAF challenge (HTTP 202, zero bytes), so the
    human landing page could not be status-verified — the OAI-PMH verbs did answer 200.
  humanURL: https://escholarship.org/uc/ucd
  tags:
  - Research Repository
  - Open Access
  - OAI-PMH
  - Tenant
  x-operator: tenant
  x-operator-evidence: >-
    escholarship.org is operated by the California Digital Library and shared across all UC campuses;
    it is not under ucdavis.edu.
  x-platform-operator: California Digital Library (University of California)
  properties:
  - type: APIReference
    url: https://escholarship.org/oai?verb=Identify
  x-audit-reconciliation: >-
    audit-university-contracts.py grades the bare host escholarship.org as VENDOR because three institutions
    in the cohort point at it. That is correct about the HOST and does not conflict with the tenant label
    here: the surface recorded is the UC Davis unit path /uc/ucd, an institution-specific account on a
    shared platform, which is the definition of tenant. No CDL or eScholarship contract is saved under
    this slug either way. Do not 'correct' this back to a saved contract.
- aid: uc-davis:library-primo-tenant
  name: UC Davis Library discovery — Ex Libris Primo (tenant)
  description: >-
    Library discovery at search.library.ucdavis.edu is an Ex Libris Primo instance. The subdomain is UC
    Davis's and the collection is UC Davis's, but the application is Ex Libris's: the served document
    is a Primo single-page app (id='primoExploreRoot') and the host resolves to 216.147.212.109, outside
    UC Davis's 128.120/169.237 address space. Recorded as a TENANT relationship. No Primo, Alma or Ex
    Libris contract is saved under this slug — that contract belongs in the vendor's own repo.
  humanURL: https://search.library.ucdavis.edu/
  tags:
  - Library
  - Discovery
  - Primo
  - Tenant
  x-operator: tenant
  x-operator-evidence: >-
    Institution subdomain on a vendor platform; DNS resolves outside UC Davis address space and the payload
    is Ex Libris Primo.
  x-platform-operator: Ex Libris (Clarivate)
  properties:
  - type: Documentation
    url: https://library.ucdavis.edu/
  x-audit-reconciliation: >-
    audit-university-contracts.py grades search.library.ucdavis.edu as INSTITUTION because the host sits
    under ucdavis.edu. The tenant label here is the stricter and more accurate read: the host resolves
    to 216.147.212.109, outside UC Davis address space, and serves an Ex Libris Primo application. A UC
    Davis-branded subdomain pointed at a vendor's platform is exactly the tenant case. Do not upgrade
    this to institution on the strength of the domain alone.
