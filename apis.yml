aid: uc-davis
name: University of California, Davis
description: 'The University of California, Davis is a public land-grant research university in Davis,
  California and a member of the ten-campus University of California system. Its programmable footprint
  is real but decentralized: there is no campus-wide developer portal, no API gateway, no published deprecation
  policy and no self-service signup for anything. What UC Davis genuinely operates and authored itself
  is three things — the Aggie Experts API (UC Davis Library, OpenAPI 3.0.0 v5.0, twelve operations over
  experts, works and grants, callable anonymously and returning JSON-LD with ORCID iDs and UC Davis ARK
  identifiers), the DAMS API behind digital.ucdavis.edu (built on the Library''s own open-source ''fin''
  framework, though several documented operations return soft-200 errors), and the PEAKS asset- and access-tracking
  API run by the College of Agricultural and Environmental Sciences (MIT-licensed, source at github.com/ucdavis/Peaks,
  API-key gated). Alongside those it runs a SAML 2.0 Shibboleth identity provider published to InCommon
  as urn:mace:incommon:ucdavis.edu, and UC Davis Health operates a live FHIR R4 endpoint on its own domain
  — although that endpoint''s CapabilityStatement is Epic''s work, not UC Davis''s, and is deliberately
  not claimed here. Two further surfaces are TENANT relationships and are labelled as such rather than
  credited as UC Davis engineering: scholarly output in eScholarship (operated by the California Digital
  Library for all of UC) and library discovery on Ex Libris Primo. Several campus surfaces that plainly
  exist — the open data portal aggiedata.ucdavis.edu, the registrar''s course search, research computing
  at hpc.ucdavis.edu — sit behind a Cloudflare bot challenge and could not be read; that is a limit on
  this profile, not evidence of absence.'
