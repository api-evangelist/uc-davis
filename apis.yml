- aid: uc-davis:health-integration
  name: UC Davis Health Systems Integration APIs
  description: >-
    UC Davis Health offers Epic (EHR), HL7 FHIR, and custom APIs accessed via SOAP or REST using JSON/XML.
    Authentication methods include API Key, OAuth2, and Direct Interconnect for existing Epic users, with
    traffic governed through InterSystems API Manager. Access is arranged through the systems integration
    team rather than open self-service.
  humanURL: https://health.ucdavis.edu/systems-integration/developers
  tags:
  - Health
  - FHIR
  - Epic
  - Integration
