  reason: partial_bot_block_and_no_self_service
  detail: 'Three genuinely institution-authored contracts were found, fetched and verified callable, so
    this is not a thin profile. It is a GATED one. Everything UC Davis operates is either open with no
    registration path at all (Aggie Experts, DAMS — no securitySchemes, no plans, no rate-limit headers)
    or closed behind institutional affiliation with no public onboarding (PEAKS API keys, IET middleware,
    UC Davis Health integration). Separately, a cluster of campus surfaces that certainly exist sits behind
    a Cloudflare bot challenge and returned 403 to every user agent tried, including a current desktop
    browser string: the AggieData open data portal, the registrar''s course search, research computing,
    and the campus IT AI pages. Those 403s are a limit on this measurement, not a finding about UC Davis
    — they are live hosts we could not read. eScholarship and ucdavis.figshare.com answer automated clients
    with an AWS WAF challenge (HTTP 202, zero bytes); the eScholarship tenant relationship was confirmed
    instead through its OAI-PMH verbs, and no Figshare tenant was claimed because none could be verified.
    No campus-wide developer portal, changelog, deprecation policy, pricing or rate-limit documentation
    exists to find.'
