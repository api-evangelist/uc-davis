  summary: 'Re-profiled under the university pipeline, which settles WHO OPERATES each surface before
    saving anything. The June 2026 pass concluded ''no openly documented public library/repository REST
    API was confirmed''. That was wrong, and this pass corrects it: UC Davis Library publishes TWO of
    its own OpenAPI documents. The Aggie Experts API (experts.ucdavis.edu/api, OpenAPI 3.0.0 v5.0, Apache-2.0,
    twelve operations, terms of use, contact address) answers anonymously and was verified callable —
    196 experts under letter A, 1,625 hits for ''genomics'' — returning JSON-LD with VIVO/vCard terms,
    UC Davis ARK identifiers and ORCID iDs. The DAMS API (digital.ucdavis.edu/api, MIT, four paths) sits
    on ''fin'', the Library''s own open-source repository framework. Also newly recorded: a SAML 2.0 Shibboleth
    IdP published to InCommon as urn:mace:incommon:ucdavis.edu, verified 200 at both the campus endpoint
    and the InCommon MDQ service — the one surface no vendor can possibly be running — and a live UC Davis
    Health FHIR R4 endpoint on emrrp.ucdmc.ucdavis.edu with a US Core CapabilityStatement and SMART configuration.
    ATTRIBUTION CORRECTIONS: the FHIR CapabilityStatement is Epic''s (''Copyright Epic 1979-2026'') and
    was deliberately NOT saved into this repo; eScholarship (California Digital Library) and library discovery
    (Ex Libris Primo) were relabelled as TENANT relationships rather than deleted or credited; the nine
    PEAKS entries were renamed to make plain they are nine tags of ONE application, not nine APIs; and
    accessModel was corrected from ''self-serve signup'' to ''no self-service signup'', which no UC Davis
    surface offers. DEFECTS RECORDED RATHER THAN SMOOTHED: DAMS returns HTTP 200 carrying an Elasticsearch
    stack trace on /api/collection and a body of null on an item miss; the production Aggie Experts API
    emits a JSON-LD @context pointing at stage.experts.library.ucdavis.edu, which does not resolve. BLOCKED:
    aggiedata.ucdavis.edu, registrar-apps.ucdavis.edu, hpc.ucdavis.edu and it.ucdavis.edu all return 403
    behind Cloudflare to every user agent tried; escholarship.org and ucdavis.figshare.com return an AWS
    WAF challenge (202, zero bytes). Those are live hosts we could not read, not absences. No Figshare
    tenant was claimed because none could be verified, and no contract was generated to fill any gap.'
